<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>礼服馆小红书获客问卷系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="home-container">
    <div class="home-logo">📋</div>
    <div class="home-title">礼服馆小红书获客问卷系统</div>
    <div class="home-subtitle">帮助礼服馆建立可持续、可复制、可复盘的小红书获客能力</div>

    <a class="home-card" href="booking.html">
      <span class="home-card-tag booking">3分钟</span>
      <div class="home-card-title">增长诊断预约表</div>
      <div class="home-card-desc">提交门店情况，预约一对一小红书增长沟通。顾问将在24小时内联系您。</div>
      <div class="home-card-meta">
        <span>📝 13题</span>
        <span>👥 老板/主理人/店长</span>
        <span>✅ 预约报名</span>
      </div>
    </a>

    <a class="home-card" href="diagnostic.html">
      <span class="home-card-tag diagnostic">8-12分钟</span>
      <div class="home-card-title">增长合作诊断表</div>
      <div class="home-card-desc">用于评估合作匹配度，制定账号矩阵、内容生产、广告投放与客资转化方案。</div>
      <div class="home-card-meta">
        <span>📝 40题</span>
        <span>👥 老板/主理人/店长</span>
        <span>📊 合作诊断</span>
      </div>
    </a>

    <a class="home-card" href="admin.html">
      <span class="home-card-tag admin">后台</span>
      <div class="home-card-title">管理后台</div>
      <div class="home-card-desc">查看问卷提交、管理线索状态、导出数据、查看统计概览。</div>
      <div class="home-card-meta">
        <span>🔐 需登录</span>
        <span>📊 数据管理</span>
      </div>
    </a>

    <a class="home-card" href="qrcode.html" style="text-align:center; padding:16px;">
      <div class="home-card-title" style="font-size:15px;">📱 生成二维码</div>
    </a>
  </div>
</body>
</html>
