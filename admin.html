<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 礼服馆小红书获客问卷系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loginPage" class="login-container">
    <div class="login-card">
      <div class="login-title">管理后台</div>
      <div class="login-subtitle">礼服馆小红书获客问卷系统</div>
      <div class="login-form">
        <input type="email" class="input-text" id="loginUser" placeholder="管理员邮箱">
        <input type="password" class="input-text" id="loginPass" placeholder="密码">
        <button class="submit-btn" onclick="doLogin()">登录</button>
      </div>
      <div style="margin-top:16px;font-size:12px;color:var(--text-light);text-align:center;">使用 Supabase Auth 账号登录</div>
      <div style="margin-top:6px;font-size:11px;color:var(--text-lighter);text-align:center;opacity:0.6;">管理员邮箱：330228720@qq.com</div>
    </div>
  </div>

  <div id="adminPage" class="admin-layout" style="display:none;">
    <div class="admin-sidebar">
      <div class="admin-logo">📋 <span>问卷管理</span></div>
      <div class="admin-nav">
        <div class="admin-nav-item active" onclick="switchTab('dashboard', event)">
          <span class="admin-nav-icon">📊</span> <span>概览</span>
        </div>
        <div class="admin-nav-item" onclick="switchTab('bookings', event)">
          <span class="admin-nav-icon">📝</span> <span>预约表</span>
        </div>
        <div class="admin-nav-item" onclick="switchTab('diagnostics', event)">
          <span class="admin-nav-icon">📋</span> <span>诊断表</span>
        </div>
        <div class="admin-nav-item" onclick="switchTab('qrcode', event)">
          <span class="admin-nav-icon">📱</span> <span>二维码</span>
        </div>
        <div class="admin-nav-item" onclick="doLogout()" style="margin-top:auto;border-top:1px solid rgba(255,255,255,0.1);">
          <span class="admin-nav-icon">🚪</span> <span>退出登录</span>
        </div>
      </div>
    </div>

    <div class="admin-main">
      <div id="tab-dashboard">
        <div class="admin-header">
          <div class="admin-title">数据概览</div>
          <button class="btn btn-outline" onclick="loadStats()">🔄 刷新</button>
        </div>
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card">
            <div class="stat-label">预约表总数</div>
            <div class="stat-value" id="stat-booking-total">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">待处理预约</div>
            <div class="stat-value warning" id="stat-booking-pending">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">诊断表总数</div>
            <div class="stat-value" id="stat-diagnostic-total">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">待处理诊断</div>
            <div class="stat-value warning" id="stat-diagnostic-pending">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">已完成跟进</div>
            <div class="stat-value success" id="stat-done">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">⚠️ 高风险承接</div>
            <div class="stat-value danger" id="stat-highrisk">-</div>
          </div>
        </div>
        <div class="data-table">
          <div class="table-toolbar">
            <div style="font-weight:600;">最近提交（预约表）</div>
            <button class="btn btn-outline" onclick="switchTab('bookings', event)">查看全部 →</button>
          </div>
          <table>
            <thead><tr><th>门店名称</th><th>城市</th><th>联系人</th><th>联系方式</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="recentBookings"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-bookings" style="display:none;">
        <div class="admin-header">
          <div class="admin-title">预约表管理</div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-outline" onclick="loadBookings()">🔄 刷新</button>
            <button class="btn btn-outline" onclick="exportData('booking')">📥 导出CSV</button>
          </div>
        </div>
        <div class="data-table">
          <div class="table-toolbar">
            <div class="search-box">
              <input type="text" class="search-input" id="bookingSearch" placeholder="搜索门店/城市/联系人" onkeyup="if(event.key==='Enter')loadBookings()">
              <select class="filter-select" id="bookingStatus">
                <option value="">全部状态</option>
                <option value="pending">待处理</option>
                <option value="following">跟进中</option>
                <option value="done">已完成</option>
              </select>
              <button class="btn btn-primary" onclick="bookingPage=1;loadBookings()">搜索</button>
            </div>
          </div>
          <table>
            <thead><tr><th>门店名称</th><th>城市</th><th>联系人</th><th>联系方式</th><th>主营业务</th><th>客单价</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="bookingsTable"></tbody>
          </table>
          <div class="pagination">
            <div id="bookingPageInfo" class="pagination-info"></div>
            <div class="pagination-buttons">
              <button class="btn btn-outline" id="bookingPrev" onclick="changeBookingPage(-1)">上一页</button>
              <button class="btn btn-outline" id="bookingNext" onclick="changeBookingPage(1)">下一页</button>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-diagnostics" style="display:none;">
        <div class="admin-header">
          <div class="admin-title">诊断表管理</div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-outline" onclick="loadDiagnostics()">🔄 刷新</button>
            <button class="btn btn-outline" onclick="exportData('diagnostic')">📥 导出CSV</button>
          </div>
        </div>
        <div class="data-table">
          <div class="table-toolbar">
            <div class="search-box">
              <input type="text" class="search-input" id="diagSearch" placeholder="搜索门店/城市" onkeyup="if(event.key==='Enter')loadDiagnostics()">
              <select class="filter-select" id="diagStatus">
                <option value="">全部状态</option>
                <option value="pending">待处理</option>
                <option value="following">跟进中</option>
                <option value="done">已完成</option>
              </select>
              <button class="btn btn-primary" onclick="diagPage=1;loadDiagnostics()">搜索</button>
            </div>
          </div>
          <table>
            <thead><tr><th>门店名称</th><th>城市</th><th>客单价</th><th>账号数</th><th>回复时效</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="diagnosticsTable"></tbody>
          </table>
          <div class="pagination">
            <div id="diagPageInfo" class="pagination-info"></div>
            <div class="pagination-buttons">
              <button class="btn btn-outline" id="diagPrev" onclick="changeDiagPage(-1)">上一页</button>
              <button class="btn btn-outline" id="diagNext" onclick="changeDiagPage(1)">下一页</button>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-qrcode" style="display:none;">
        <div class="admin-header">
          <div class="admin-title">二维码生成</div>
        </div>
        <div class="qrcode-grid">
          <div class="qrcode-card">
            <div class="qrcode-card-title">预约表二维码</div>
            <div class="qrcode-card-desc">扫码直接打开增长诊断预约表</div>
            <div class="qrcode-image" id="qrBooking"></div>
            <div class="qrcode-actions">
              <button class="btn btn-outline" onclick="downloadQR('booking')">📥 下载</button>
            </div>
            <div class="qrcode-url" id="qrBookingUrl"></div>
          </div>
          <div class="qrcode-card">
            <div class="qrcode-card-title">诊断表二维码</div>
            <div class="qrcode-card-desc">扫码直接打开合作诊断表</div>
            <div class="qrcode-image" id="qrDiagnostic"></div>
            <div class="qrcode-actions">
              <button class="btn btn-outline" onclick="downloadQR('diagnostic')">📥 下载</button>
            </div>
            <div class="qrcode-url" id="qrDiagnosticUrl"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-modal" id="detailModal"></div>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    let isLoggedIn = false;
    let currentTab = 'dashboard';
    let bookingPage = 1;
    let diagPage = 1;
    const limit = 20;

    // ============ 初始化：检查登录状态 ============
    (async function init() {
      if (!checkSupabaseConfig()) return;
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showAdmin();
      }
    })();

    function showAdmin() {
      isLoggedIn = true;
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('adminPage').style.display = 'flex';
      loadStats();
      loadRecentBookings();
    }

    // ============ 登录 ============
    async function doLogin() {
      if (!checkSupabaseConfig()) return;
      const email = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!email || !password) { alert('请输入邮箱和密码'); return; }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('登录失败：' + error.message);
        return;
      }
      showAdmin();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const passInput = document.getElementById('loginPass');
      if (passInput) {
        passInput.addEventListener('keyup', e => { if (e.key === 'Enter') doLogin(); });
      }
    });

    // ============ 退出登录 ============
    async function doLogout() {
      await supabase.auth.signOut();
      isLoggedIn = false;
      document.getElementById('adminPage').style.display = 'none';
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('loginPass').value = '';
    }

    // ============ 切换Tab ============
    function switchTab(tab, event) {
      currentTab = tab;
      document.querySelectorAll('.admin-nav-item').forEach(el => el.classList.remove('active'));
      if (event) event.target.closest('.admin-nav-item').classList.add('active');
      document.querySelectorAll('[id^="tab-"]').forEach(el => el.style.display = 'none');
      const tabEl = document.getElementById('tab-' + tab);
      if (tabEl) tabEl.style.display = 'block';
      if (tab === 'dashboard') { loadStats(); loadRecentBookings(); }
      if (tab === 'bookings') loadBookings();
      if (tab === 'diagnostics') loadDiagnostics();
      if (tab === 'qrcode') loadQRCodes();
    }

    // ============ 统计 ============
    async function loadStats() {
      try {
        const [
          { count: bt }, { count: bp }, { count: bd },
          { count: dt }, { count: dp }, { count: dd }, { count: hr }
        ] = await Promise.all([
          supabase.from('bookings').select('*', { count: 'exact', head: true }),
          supabase.from('bookings').select('*', { count: 'exact', head: true }).eq('status', 'pending'),
          supabase.from('bookings').select('*', { count: 'exact', head: true }).eq('status', 'done'),
          supabase.from('diagnostics').select('*', { count: 'exact', head: true }),
          supabase.from('diagnostics').select('*', { count: 'exact', head: true }).eq('status', 'pending'),
          supabase.from('diagnostics').select('*', { count: 'exact', head: true }).eq('status', 'done'),
          supabase.from('diagnostics').select('*', { count: 'exact', head: true }).eq('response_time', '基本无人跟进')
        ]);
        document.getElementById('stat-booking-total').textContent = bt || 0;
        document.getElementById('stat-booking-pending').textContent = bp || 0;
        document.getElementById('stat-diagnostic-total').textContent = dt || 0;
        document.getElementById('stat-diagnostic-pending').textContent = dp || 0;
        document.getElementById('stat-done').textContent = (bd || 0) + (dd || 0);
        document.getElementById('stat-highrisk').textContent = hr || 0;
      } catch (e) { console.error('Stats error:', e); }
    }

    // ============ 最近预约 ============
    async function loadRecentBookings() {
      try {
        const { data, error } = await supabase.from('bookings').select('*').order('created_at', { ascending: false }).limit(5);
        if (error) throw error;
        const tbody = document.getElementById('recentBookings');
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:24px;">暂无数据</td></tr>';
          return;
        }
        tbody.innerHTML = data.map(r => `
          <tr>
            <td>${esc(r.store_name)}</td>
            <td>${esc(r.city)}</td>
            <td>${esc(r.contact_name)}</td>
            <td>${esc(r.contact_info)}</td>
            <td>${formatTime(r.created_at)}</td>
            <td><span class="status-badge status-${r.status}">${statusText(r.status)}</span></td>
            <td><button class="btn btn-outline" onclick="viewBooking('${r.id}')">详情</button></td>
          </tr>
        `).join('');
      } catch (e) { console.error(e); }
    }

    // ============ 预约表列表 ============
    async function loadBookings() {
      try {
        const search = document.getElementById('bookingSearch').value.trim();
        const status = document.getElementById('bookingStatus').value;
        let query = supabase.from('bookings').select('*', { count: 'exact' }).order('created_at', { ascending: false });
        if (search) {
          query = query.or(`store_name.ilike.%${search}%,city.ilike.%${search}%,contact_name.ilike.%${search}%,contact_info.ilike.%${search}%`);
        }
        if (status) query = query.eq('status', status);
        query = query.range((bookingPage - 1) * limit, bookingPage * limit - 1);
        const { data, error, count } = await query;
        if (error) throw error;
        const tbody = document.getElementById('bookingsTable');
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;padding:24px;">暂无数据</td></tr>';
        } else {
          tbody.innerHTML = data.map(r => `
            <tr>
              <td>${esc(r.store_name)}</td>
              <td>${esc(r.city)}</td>
              <td>${esc(r.contact_name)}</td>
              <td>${esc(r.contact_info)}</td>
              <td>${esc(r.main_business) || '-'}</td>
              <td>${esc(r.price_range) || '-'}</td>
              <td>${formatTime(r.created_at)}</td>
              <td>
                <select class="filter-select" onchange="updateStatus('booking','${r.id}',this.value)">
                  <option value="pending" ${r.status==='pending'?'selected':''}>待处理</option>
                  <option value="following" ${r.status==='following'?'selected':''}>跟进中</option>
                  <option value="done" ${r.status==='done'?'selected':''}>已完成</option>
                </select>
              </td>
              <td><button class="btn btn-outline" onclick="viewBooking('${r.id}')">详情</button></td>
            </tr>
          `).join('');
        }
        const total = count || 0;
        document.getElementById('bookingPageInfo').textContent = `第 ${bookingPage} 页 / 共 ${Math.ceil(total/limit)||1} 页（${total} 条）`;
        document.getElementById('bookingPrev').disabled = bookingPage <= 1;
        document.getElementById('bookingNext').disabled = bookingPage >= Math.ceil(total/limit);
      } catch (e) { console.error(e); alert('加载失败：' + e.message); }
    }

    function changeBookingPage(delta) {
      bookingPage += delta;
      if (bookingPage < 1) bookingPage = 1;
      loadBookings();
    }

    // ============ 诊断表列表 ============
    async function loadDiagnostics() {
      try {
        const search = document.getElementById('diagSearch').value.trim();
        const status = document.getElementById('diagStatus').value;
        let query = supabase.from('diagnostics').select('*', { count: 'exact' }).order('created_at', { ascending: false });
        if (search) {
          query = query.or(`store_name.ilike.%${search}%,city.ilike.%${search}%`);
        }
        if (status) query = query.eq('status', status);
        query = query.range((diagPage - 1) * limit, diagPage * limit - 1);
        const { data, error, count } = await query;
        if (error) throw error;
        const tbody = document.getElementById('diagnosticsTable');
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;padding:24px;">暂无数据</td></tr>';
        } else {
          tbody.innerHTML = data.map(r => `
            <tr>
              <td>${esc(r.store_name)}</td>
              <td>${esc(r.city)}</td>
              <td>${esc(r.price_range) || '-'}</td>
              <td>${esc(r.account_count) || '-'}</td>
              <td>${esc(r.response_time) || '-'}${r.response_time==='基本无人跟进'?'<span class="risk-badge">高风险</span>':''}</td>
              <td>${formatTime(r.created_at)}</td>
              <td>
                <select class="filter-select" onchange="updateStatus('diagnostic','${r.id}',this.value)">
                  <option value="pending" ${r.status==='pending'?'selected':''}>待处理</option>
                  <option value="following" ${r.status==='following'?'selected':''}>跟进中</option>
                  <option value="done" ${r.status==='done'?'selected':''}>已完成</option>
                </select>
              </td>
              <td><button class="btn btn-outline" onclick="viewDiagnostic('${r.id}')">详情</button></td>
            </tr>
          `).join('');
        }
        const total = count || 0;
        document.getElementById('diagPageInfo').textContent = `第 ${diagPage} 页 / 共 ${Math.ceil(total/limit)||1} 页（${total} 条）`;
        document.getElementById('diagPrev').disabled = diagPage <= 1;
        document.getElementById('diagNext').disabled = diagPage >= Math.ceil(total/limit);
      } catch (e) { console.error(e); alert('加载失败：' + e.message); }
    }

    function changeDiagPage(delta) {
      diagPage += delta;
      if (diagPage < 1) diagPage = 1;
      loadDiagnostics();
    }

    // ============ 更新状态 ============
    async function updateStatus(type, id, status) {
      try {
        const table = type === 'booking' ? 'bookings' : 'diagnostics';
        const { error } = await supabase.from(table).update({ status }).eq('id', id);
        if (error) throw error;
      } catch (e) { alert('更新失败：' + e.message); }
    }

    // ============ 预约详情 ============
    async function viewBooking(id) {
      try {
        const { data: d, error } = await supabase.from('bookings').select('*').eq('id', id).single();
        if (error) throw error;
        document.getElementById('detailModal').innerHTML = `
          <div class="detail-header">
            <div class="detail-title">${esc(d.store_name)} - 预约详情</div>
            <button class="detail-close" onclick="closeDetail()">&times;</button>
          </div>
          <div class="detail-section">
            <div class="detail-section-title">门店与联系人</div>
            <div class="detail-row"><div class="detail-label">门店名称</div><div class="detail-value">${esc(d.store_name)}</div></div>
            <div class="detail-row"><div class="detail-label">城市及服务区域</div><div class="detail-value">${esc(d.city)}</div></div>
            <div class="detail-row"><div class="detail-label">身份</div><div class="detail-value">${esc(d.identity)}</div></div>
            <div class="detail-row"><div class="detail-label">联系人</div><div class="detail-value">${esc(d.contact_name)}</div></div>
            <div class="detail-row"><div class="detail-label">联系方式</div><div class="detail-value">${esc(d.contact_info)}</div></div>
          </div>
          <div class="detail-section">
            <div class="detail-section-title">门店基础情况</div>
            <div class="detail-row"><div class="detail-label">主营业务</div><div class="detail-value">${esc(d.main_business) || '-'}</div></div>
            <div class="detail-row"><div class="detail-label">主力客单价</div><div class="detail-value">${esc(d.price_range) || '-'}</div></div>
          </div>
          <div class="detail-section">
            <div class="detail-section-title">当前需求</div>
            <div class="detail-row"><div class="detail-label">最想解决的问题</div><div class="detail-value">${esc(d.main_problem) || '-'}</div></div>
            <div class="detail-row"><div class="detail-label">账号状态</div><div class="detail-value">${esc(d.account_status) || '-'}</div></div>
            <div class="detail-row"><div class="detail-label">广告投放状态</div><div class="detail-value">${esc(d.ad_status) || '-'}</div></div>
          </div>
          <div class="detail-section">
            <div class="detail-section-title">沟通偏好</div>
            <div class="detail-row"><div class="detail-label">沟通方式</div><div class="detail-value">${esc(d.comm_method) || '-'}</div></div>
            <div class="detail-row"><div class="detail-label">沟通时间</div><div class="detail-value">${esc(d.comm_time) || '-'}</div></div>
            <div class="detail-row"><div class="detail-label">10分钟切入点</div><div class="detail-value">${esc(d.quick_question) || '-'}</div></div>
          </div>
          <div class="detail-section">
            <div class="detail-row"><div class="detail-label">提交时间</div><div class="detail-value">${formatTime(d.created_at)}</div></div>
          </div>
          <div class="detail-actions">
            <button class="btn btn-primary" onclick="updateAndClose('booking','${d.id}','following')">标记跟进中</button>
            <button class="btn btn-primary" onclick="updateAndClose('booking','${d.id}','done')">标记已完成</button>
            <button class="btn btn-outline" onclick="closeDetail()">关闭</button>
          </div>
        `;
        document.getElementById('detailOverlay').classList.add('show');
      } catch (e) { alert('加载失败：' + e.message); }
    }

    // ============ 诊断详情 ============
    async function viewDiagnostic(id) {
      try {
        const { data: d, error } = await supabase.from('diagnostics').select('*').eq('id', id).single();
        if (error) throw error;
        const fieldLabels = {
          store_name: '门店名称', city: '城市及服务区域', store_age: '成立年限', store_area: '门店面积',
          categories: '主营品类', business_model: '经营模式', price_range: '主力客单价', business_goal: '核心经营目标',
          advantages: '竞争优势', popular_products: '热门礼服/套餐', customer_concerns: '客户顾虑', competitors: '竞争对手',
          xhs_consults_30d: '近30天有效咨询', xhs_visits_30d: '近30天预约到店', xhs_deals_30d: '近30天成交',
          photo_count: '客片数量', photo_auth: '客片授权', weekly_materials: '每周可提供素材', on_camera_person: '可出镜人员', content_menpower: '内容人力',
          account_count: '账号数量', account_names: '账号昵称', account_owners: '账号负责人', post_frequency: '发布频率', account_issues: '账号矩阵问题', avg_exposure: '平均曝光',
          ad_history: '投放经历', ad_account: '广告账户', ad_spend_90d: '近90天消耗', ad_results: '投放结果', ad_no_data_reason: '无数据原因', ad_budget: '广告预算', ad_goal: '广告目标',
          consult_handler: '咨询跟进人', response_time: '回复时效', project_contact: '项目对接人', monthly_shoot: '拍摄配合', cooperation_period: '合作周期', agree_diagnosis: '同意诊断', agree_case: '同意案例'
        };
        const sections = [
          { title: '门店经营基础', fields: ['store_name','city','store_age','store_area','categories','business_model','price_range','business_goal'] },
          { title: '产品、客户与差异化', fields: ['advantages','popular_products','customer_concerns','competitors'] },
          { title: '经营数据', fields: ['xhs_consults_30d','xhs_visits_30d','xhs_deals_30d'] },
          { title: '素材与内容能力', fields: ['photo_count','photo_auth','weekly_materials','on_camera_person','content_menpower'] },
          { title: '账号矩阵', fields: ['account_count','account_names','account_owners','post_frequency','account_issues','avg_exposure'] },
          { title: '广告投放', fields: ['ad_history','ad_account','ad_spend_90d','ad_results','ad_no_data_reason','ad_budget','ad_goal'] },
          { title: '客资承接与团队配合', fields: ['consult_handler','response_time','project_contact','monthly_shoot','cooperation_period','agree_diagnosis','agree_case'] }
        ];

        let html = `
          <div class="detail-header">
            <div class="detail-title">${esc(d.store_name)} - 诊断详情</div>
            <button class="detail-close" onclick="closeDetail()">&times;</button>
          </div>
          ${d.response_time === '基本无人跟进' ? '<div class="info-banner" style="background:#F5E8E8;border-color:#D8B8B8;color:#8B5C5C;">⚠️ 高风险承接：该门店咨询基本无人跟进，建议优先补足客资承接能力</div>' : ''}
        `;
        sections.forEach(sec => {
          html += `<div class="detail-section"><div class="detail-section-title">${sec.title}</div>`;
          sec.fields.forEach(f => {
            html += `<div class="detail-row"><div class="detail-label">${fieldLabels[f]||f}</div><div class="detail-value">${esc(d[f]) || '-'}</div></div>`;
          });
          html += `</div>`;
        });
        html += `
          <div class="detail-section">
            <div class="detail-row"><div class="detail-label">提交时间</div><div class="detail-value">${formatTime(d.created_at)}</div></div>
          </div>
          <div class="detail-actions">
            <button class="btn btn-primary" onclick="updateAndClose('diagnostic','${d.id}','following')">标记跟进中</button>
            <button class="btn btn-primary" onclick="updateAndClose('diagnostic','${d.id}','done')">标记已完成</button>
            <button class="btn btn-outline" onclick="closeDetail()">关闭</button>
          </div>
        `;
        document.getElementById('detailModal').innerHTML = html;
        document.getElementById('detailOverlay').classList.add('show');
      } catch (e) { alert('加载失败：' + e.message); }
    }

    function closeDetail() { document.getElementById('detailOverlay').classList.remove('show'); }

    async function updateAndClose(type, id, status) {
      await updateStatus(type, id, status);
      closeDetail();
      if (type === 'booking') loadBookings(); else loadDiagnostics();
    }

    // ============ 导出CSV ============
    async function exportData(type) {
      try {
        const table = type === 'booking' ? 'bookings' : 'diagnostics';
        const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0) { alert('暂无数据'); return; }

        const headers = Object.keys(data[0]);
        const csvLines = [headers.join(',')];
        data.forEach(row => {
          csvLines.push(headers.map(h => {
            let val = row[h];
            if (Array.isArray(val)) val = val.join('、');
            return `"${String(val || '').replace(/"/g, '""')}"`;
          }).join(','));
        });

        const blob = new Blob(['\ufeff' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${type}_${Date.now()}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (e) { alert('导出失败：' + e.message); }
    }

    // ============ 二维码 ============
    function loadQRCodes() {
      const baseUrl = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
      const bookingUrl = `${baseUrl}booking.html`;
      const diagUrl = `${baseUrl}diagnostic.html`;
      document.getElementById('qrBookingUrl').textContent = bookingUrl;
      document.getElementById('qrDiagnosticUrl').textContent = diagUrl;
      document.getElementById('qrBooking').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(bookingUrl)}" alt="预约表二维码">`;
      document.getElementById('qrDiagnostic').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(diagUrl)}" alt="诊断表二维码">`;
    }

    function downloadQR(type) {
      const url = type === 'booking' ? document.querySelector('#qrBooking img').src : document.querySelector('#qrDiagnostic img').src;
      const a = document.createElement('a');
      a.href = url;
      a.download = `${type}_qrcode.png`;
      a.click();
    }

    // ============ 工具函数 ============
    function formatTime(t) {
      if (!t) return '-';
      try { return new Date(t).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }); } catch { return String(t); }
    }
    function statusText(s) { return { pending: '待处理', following: '跟进中', done: '已完成' }[s] || s; }
    function esc(s) {
      if (s === null || s === undefined) return '';
      if (Array.isArray(s)) return s.map(item => String(item).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')).join('、');
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
